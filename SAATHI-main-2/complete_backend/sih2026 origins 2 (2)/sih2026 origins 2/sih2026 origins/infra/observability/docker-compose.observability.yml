version: '3.8'

# SAATHI Observability Stack
# Run with: docker-compose -f infra/observability/docker-compose.observability.yml up -d
#
# Components:
#   - Prometheus (metrics scraping and alerting)
#   - Grafana (dashboards)
#   - Loki (structured log aggregation)
#   - Promtail (log shipper → Loki)
#   - Jaeger (distributed tracing)
#
# Access:
#   Grafana:    http://localhost:3100 (admin/saathi-obs-admin)
#   Prometheus: http://localhost:9090
#   Jaeger:     http://localhost:16686

networks:
  observability:
    driver: bridge
  saathi-network:
    external: true  # Connects to running SAATHI services

services:
  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: saathi-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks: [observability, saathi-network]

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: saathi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-saathi-obs-admin}
      GF_FEATURE_TOGGLES_ENABLE: tempoSearch tempoBackendSearch
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3100:3000"
    depends_on: [prometheus, loki]
    networks: [observability]

  # ── Loki (log aggregation) ─────────────────────────────────
  loki:
    image: grafana/loki:2.9.5
    container_name: saathi-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3101:3100"
    networks: [observability, saathi-network]

  # ── Promtail (log shipper: Docker → Loki) ─────────────────
  promtail:
    image: grafana/promtail:2.9.5
    container_name: saathi-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [observability]

  # ── Jaeger (distributed tracing) ──────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: saathi-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      SPAN_STORAGE_TYPE: memory    # Use elasticsearch in production
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks: [observability, saathi-network]

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
