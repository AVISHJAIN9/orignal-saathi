apiVersion: apps/v1
kind: Deployment
metadata:
  name: p1-auth
  labels:
    app: p1-auth
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: p1-auth
  template:
    metadata:
      labels:
        app: p1-auth
    spec:
      containers:
        - name: p1-auth
          image: saathi/p1-auth:latest
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: saathi-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: saathi-config
                  key: DB_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: saathi-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: p1-auth-svc
  labels:
    app: p1-auth
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: p1-auth
