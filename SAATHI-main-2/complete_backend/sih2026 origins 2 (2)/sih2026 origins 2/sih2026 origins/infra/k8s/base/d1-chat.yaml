---
# D1 Chat Gateway — Kubernetes Deployment
# Target: 10–50 replicas via HPA (scales on CPU + custom RAG latency metric)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: d1-chat
  namespace: saathi-prod
  labels:
    app: d1-chat
    tier: gateway
    version: "1.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: d1-chat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0        # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: d1-chat
        tier: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      # Node affinity: prefer nodes in ap-south-1 AZs for data residency
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [d1-chat]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: d1-chat
          image: saathi/d1-chat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: saathi-db-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: saathi-redis-secret
                  key: REDIS_URL
            - name: SARVAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: saathi-api-keys
                  key: SARVAM_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: saathi-jwt-secrets
                  key: JWT_SECRET
            - name: M5_RAG_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: saathi-config
                  key: M5_RAG_ENDPOINT
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]  # Allow in-flight SSE to drain
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: d1-chat
  namespace: saathi-prod
spec:
  selector:
    app: d1-chat
  ports:
    - name: http
      port: 80
      targetPort: 5001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: d1-chat-hpa
  namespace: saathi-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: d1-chat
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 5
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300     # Don't scale down too quickly
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
