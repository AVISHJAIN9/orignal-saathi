version: '3.8'

services:
  d1-chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saathi-d1-chat-service
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=saathi_db
      - RAG_SERVICE_URL=http://fastapi-m5:8000
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    container_name: saathi-d1-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saathi_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
