# Local dev stack: a throwaway Postgres + this service, matching the
# master spec's "Docker + Docker Compose for dev" DevOps note. Not the
# demo path for the full SAATHI app (D4 is one feature slice), but
# enough to run and poke at this service in isolation.
#
#   docker compose up --build
#   docker compose exec app npm run migration:run
#   docker compose exec db psql -U saathi -d saathi_dev -f /seed.sql
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: saathi
      POSTGRES_PASSWORD: saathi
      POSTGRES_DB: saathi_dev
    ports:
      - '5432:5432'
    volumes:
      - saathi_d4_pgdata:/var/lib/postgresql/data
      - ./scripts/seed.sql:/seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saathi']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://saathi:saathi@db:5432/saathi_dev
      PGSSL: 'false'
      PORT: '5004'
      MAX_RESUME_MESSAGES: '2000'
    ports:
      - '5004:5004'

volumes:
  saathi_d4_pgdata:
