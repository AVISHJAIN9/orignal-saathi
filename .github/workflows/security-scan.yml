name: SAATHI Security Scan - Semgrep & OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 3am Full Scan

jobs:
  semgrep-sast:
    name: Semgrep SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Scan
        run: |
          python3 -m pip install semgrep
          semgrep --config .semgrep.yml --error --metrics=off

  zap-baseline-dast:
    name: OWASP ZAP Baseline Security Scan
    runs-on: ubuntu-latest
    needs: semgrep-sast
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan (Passive DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
